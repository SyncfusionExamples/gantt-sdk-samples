<!DOCTYPE html>
<html>
<head>
    <title>Syncfusion React Sample</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="description" content="Syncfusion React UI Components" />
    <meta name="author" content="Syncfusion" />
    <link href="https://cdn.syncfusion.com/ej2/34.2.2/tailwind3.css" rel="stylesheet">
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        .status-bar {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 10px 14px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    background: #fafafa;
    margin-bottom: 10px;
    font-size: 14px;
}

.record-dropdown {
    margin-left: 6px;
    padding: 4px 8px;
    border: 1px solid #d1d5db;
    border-radius: 4px;
}

#output {
    color: #2563eb;
    font-weight: 600;
}

.validation-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    user-select: none;
}

.validation-toggle input[type="checkbox"] {
    margin: 0;
    cursor: pointer;
}

.dataset-control {
    display: inline-flex;
    align-items: center;
    gap: 10px;
}

.dataset-control label {
    font-weight: 500;
}

.current-selection {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 12px;
    background: #e0e7ff;
    color: #1e40af;
    font-size: 13px;
}

.current-selection strong {
    font-weight: 700;
    margin: 0 2px;
}

.status-text {
    margin-left: auto;
    color: #2563eb;
    font-weight: 600;
}

.record-dropdown:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}
    </style>
</head>

<body class="tailwind3">
     <style>
            .control-section
            {
                margin-top: 100px;
            }
    </style>
    <div id='sample'>
</body>
</html>
