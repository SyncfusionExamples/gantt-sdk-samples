<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Syncfusion React Sample</title>
    <meta http-equiv="refresh"
          content="0; url=https://syncfusionexamples.github.io/gantt-sdk-samples/react-gantt/virtual-scrolling-large-dataset/" />
    <link rel="canonical"
          href="https://syncfusionexamples.github.io/gantt-sdk-samples/react-gantt/virtual-scrolling-large-dataset/" />
    <script>
        // GH Pages SPA fallback — restore the original path under #/ so
        // createBrowserHistory keeps working after the redirect.
        (function () {
            var pathSegmentsToKeep = 3; // /gantt-sdk-samples/react-gantt/virtual-scrolling-large-dataset
            var l = window.location;
            l.replace(
                l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
                l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
                (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                l.hash
            );
        })();
    </script>
</head>
<body>
    <p>Redirecting&hellip;</p>
</body>
</html>
